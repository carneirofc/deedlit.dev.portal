name: Portal image

# Builds the deedlit.dev portal container and publishes it to GHCR.
# The digest printed in the job summary is what goes into
# `apps/portal/values-prd.yaml` in the deedlit.dev.infra repository.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deedlit.dev-portal

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@carneirofc'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npx biome lint .

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests for the security-critical rules (redirects, allow-lists,
      # rate-limit keys, CSP, discovery). Gates the image build below.
      - name: Test
        run: npm test

      # Fails the build on a known-vulnerable runtime dependency.
      # `--omit=dev` because dev deps do not reach the runtime stage.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  scan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds locally without pushing, so a vulnerable image is never
      # published and then retracted.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portal:scan
          cache-from: type=gha
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      # Pinned by commit SHA, not by tag. Upstream retagged its releases with a
      # `v` prefix and the old unprefixed `0.28.0` stopped resolving, which
      # failed this job before it ran a single scan — and a tag is mutable
      # anyway, so a moved tag would silently change what gates the image.
      # Refresh with: gh api repos/aquasecurity/trivy-action/git/ref/tags/vX.Y.Z
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portal:scan
          format: table
          severity: HIGH,CRITICAL
          # Unfixed OS advisories are not actionable in a build gate — they
          # come and go with the base image and have no upgrade to take.
          ignore-unfixed: true
          # Time-boxed exceptions only; see the file.
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  publish:
    needs: [verify, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          {
            echo "### Portal image published"
            echo
            echo '```'
            echo "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin this digest in \`apps/portal/values-prd.yaml\` (deedlit.dev.infra)."
          } >> "$GITHUB_STEP_SUMMARY"
